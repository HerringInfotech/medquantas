<app-loader [isLoader]="page_loading"></app-loader>
<div class="container-fluid custom-page">
  <!-- Header Section -->
  <div class="header-card">
    <h5>Conversion Factor Master</h5>
  </div>

  <div class="bg-white rounded-6px p-4 shadow-sm" *ngIf="factor">
    <form #formData="ngForm" (ngSubmit)="formSubmit(formData)">
      <div class="row g-3 mb-3">

        <!-- Factor Name (read-only) -->
        <div class="col-md-3">
          <label class="form-label">Factor Name</label>
          <input class="form-control bg-light" [value]="factor.name" disabled />
        </div>

        <!-- 1 USD = INR -->
        <div class="col-md-3">
          <label class="form-label">1 USD = INR <span class="text-danger">*</span></label>
          <input name="inrToUsd" type="number" step="0.01" min="0" class="form-control"
            required [(ngModel)]="factor.inrToUsd" #inrToUsd="ngModel"
            [ngClass]="{ 'is-invalid': inrToUsd.invalid && (inrToUsd.dirty || inrToUsd.touched || formData.submitted) }" />
          <div *ngIf="inrToUsd.invalid && (inrToUsd.dirty || inrToUsd.touched || formData.submitted)"
            class="invalid-feedback">
            <span *ngIf="inrToUsd.errors?.required">Value is required.</span>
            <span *ngIf="inrToUsd.errors?.min">Must be positive value.</span>
          </div>
        </div>

        <!-- Updated Date & Time -->
        <div class="col-md-3" *ngIf="factor.updatedAt">
          <label class="form-label">Last Updated</label>
          <input class="form-control bg-light" [value]="factor.updatedAt | date: 'dd-MMM-yyyy HH:mm:ss'" disabled />
        </div>

      </div>

      <!-- Action Buttons -->
      <div class="d-flex gap-2 mt-2">
        <button type="button" class="btn custom-button" (click)="fetchLiveRate()" [disabled]="rate_loading">
          <span *ngIf="!rate_loading"><i class="bi bi-cpu me-1"></i> AI Live Rate</span>
          <span *ngIf="rate_loading"><span class="spinner-border spinner-border-sm me-1"></span> Fetching...</span>
        </button>

        <button type="submit" class="btn custom-button" [disabled]="btn_loading || formData.invalid">
          <span *ngIf="!btn_loading">Update</span>
          <span *ngIf="btn_loading"><span class="spinner-border spinner-border-sm me-1"></span> Saving...</span>
        </button>
      </div>

    </form>
  </div>
</div>
